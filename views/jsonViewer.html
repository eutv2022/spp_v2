<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Respuesta API</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="jsonOutput" style="white-space: pre-wrap; padding: 20px;"></div>

  <script>
    const raw = localStorage.getItem("apiResponse");
    const parsed = JSON.parse(raw);
    document.getElementById("jsonOutput").innerText = JSON.stringify(parsed, null, 2);
  </script>
</body>
</html>
