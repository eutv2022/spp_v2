name: Build Android APK

on:
  workflow_dispatch: # Permite compilar la app manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ☕ Configurar Java (Motor de Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Instalar dependencias
        run: npm install

      - name: 🔄 Sincronizar código Web con Android
        run: npx cap sync android

      - name: 🔨 Dar permisos al compilador (Gradle)
        run: chmod +x android/gradlew

      - name: 🚀 Compilar el archivo APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 📤 Entregar el APK terminado
        uses: actions/upload-artifact@v4
        with:
          name: WorldTV-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
